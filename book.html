<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro - Free Bible App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📖 Free Bible App</h1>
            <p>Tu acceso gratuito a la Biblia en cualquier momento y lugar</p>
        </header>

        <!-- Back to Home Button -->
        <div style="padding: 20px;">
            <a href="index.html" class="back-link">← Volver a Inicio</a>
        </div>

        <!-- Book Header -->
        <div class="book-header">
            <h1 id="book-title"></h1>
            <p id="book-info"></p>
        </div>

        <!-- Chapter Selector -->
        <div class="book-content">
            <div class="chapter-selector">
                <label for="chapter-select">Selecciona un capítulo:</label>
                <select id="chapter-select" onchange="showChapter(this.value)">
                    <option value="">-- Selecciona un capítulo --</option>
                </select>
            </div>

            <!-- Chapter Content Container -->
            <div id="verses-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Obtener el ID del libro desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');

        // Cargar XML y mostrar el libro
        fetch('bible.xml')
            .then(response => response.text())
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const books = xmlDoc.getElementsByTagName('book');
                let foundBook = null;
                
                for (let book of books) {
                    if (book.getAttribute('id') === bookId) {
                        foundBook = book;
                        break;
                    }
                }
                
                if (foundBook) {
                    const bookName = foundBook.getAttribute('name');
                    const chapters = foundBook.getElementsByTagName('chapter');
                    const totalChapters = foundBook.getAttribute('chapters');
                    
                    // Actualizar título
                    document.getElementById('book-title').textContent = bookName;
                    document.getElementById('book-info').textContent = `Total de capítulos: ${totalChapters}`;
                    
                    // Llenar selector de capítulos
                    const chapterSelect = document.getElementById('chapter-select');
                    for (let chapter of chapters) {
                        const chapterNum = chapter.getAttribute('number');
                        const option = document.createElement('option');
                        option.value = chapterNum;
                        option.textContent = `Capítulo ${chapterNum}`;
                        chapterSelect.appendChild(option);
                    }
                    
                    // Mostrar primer capítulo por defecto
                    if (chapters.length > 0) {
                        chapterSelect.value = chapters[0].getAttribute('number');
                        displayChapter(chapters[0]);
                    }
                    
                    // Event listener para cambiar capítulos
                    chapterSelect.addEventListener('change', function() {
                        if (this.value) {
                            for (let chapter of chapters) {
                                if (chapter.getAttribute('number') === this.value) {
                                    displayChapter(chapter);
                                    break;
                                }
                            }
                        }
                    });
                }
            })
            .catch(error => console.error('Error cargando XML:', error));
        
        function displayChapter(chapter) {
            const verses = chapter.getElementsByTagName('verse');
            let versesHTML = `<h2>${document.getElementById('book-title').textContent} - Capítulo ${chapter.getAttribute('number')}</h2>`;
            
            for (let verse of verses) {
                const verseNumber = verse.getAttribute('number');
                const verseText = verse.textContent;
                versesHTML += `
                    <div class="verse">
                        <span class="verse-number">${verseNumber}</span>
                        <span class="verse-text">${verseText}</span>
                    </div>
                `;
            }
            
            document.getElementById('verses-container').innerHTML = versesHTML;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
