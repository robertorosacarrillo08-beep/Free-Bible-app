<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Bible App - Biblia Gratis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Free Bible App</h1>
            <p>Tu acceso gratuito a la Biblia en cualquier momento y lugar</p>
        </header>
        <div class="tabs">
            <button class="tab-button active" onclick="showTestament('old')">Antiguo Testamento</button>
            <button class="tab-button" onclick="showTestament('new')">Nuevo Testamento</button>
        </div>
        <section id="old-testament" class="testament-section active">
            <h2>Antiguo Testamento</h2>
            <div class="books-grid" id="old-testament-books"></div>
        </section>
        <section id="new-testament" class="testament-section">
            <h2>Nuevo Testamento</h2>
            <div class="books-grid" id="new-testament-books"></div>
        </section>
    </div>
    <script src="script.js"></script>
    <script>
        fetch('bible.xml')
            .then(response => response.text())
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                const testaments = xmlDoc.getElementsByTagName('testament');
                const categoryConfig = {
                    old: [
                        { title: 'Pentateuco', ids: ['genesis', 'exodo', 'levitico', 'numeros', 'deuteronomio'] },
                        { title: 'Libros Históricos', ids: ['josue', 'jueces', 'rut', '1samuel', '2samuel', '1reyes', '2reyes', '1cronicas', '2cronicas', 'esdras', 'nehemias', 'ester'] },
                        { title: 'Libros Poéticos', ids: ['job', 'salmos', 'proverbios', 'eclesiastes', 'cantares'] },
                        { title: 'Profetas Mayores', ids: ['isaias', 'jeremias', 'lamentaciones', 'ezequiel', 'daniel'] },
                        { title: 'Profetas Menores', ids: ['oseas', 'joel', 'amos', 'abdias', 'jonas', 'miqueas', 'nahum', 'habacuc', 'sofonias', 'hageo', 'zacarias', 'malaquias'] }
                    ],
                    new: [
                        { title: 'Evangelios', ids: ['mateo', 'marcos', 'lucas', 'juan'] },
                        { title: 'Historia', ids: ['hechos'] },
                        { title: 'Cartas Paulinas', ids: ['romanos', '1corintios', '2corintios', 'galatas', 'efesios', 'filipenses', 'colosenses', '1tesalonicenses', '2tesalonicenses', '1timoteo', '2timoteo', 'tito', 'filemon'] },
                        { title: 'Cartas Generales', ids: ['hebreos', 'santiago', '1pedro', '2pedro', '1juan', '2juan', '3juan', 'judas'] },
                        { title: 'Profecía', ids: ['apocalipsis'] }
                    ]
                };

                for (let testament of testaments) {
                    const testamentName = testament.getAttribute('name');
                    const books = Array.from(testament.getElementsByTagName('book'));
                    const testamentKey = testamentName === 'Antiguo Testamento' ? 'old' : 'new';
                    const booksById = new Map();
                    books.forEach(book => {
                        booksById.set(book.getAttribute('id'), {
                            id: book.getAttribute('id'),
                            name: book.getAttribute('name')
                        });
                    });

                    let booksHTML = '';
                    const usedIds = new Set();
                    categoryConfig[testamentKey].forEach(category => {
                        const categoryBooks = category.ids
                            .filter(bookId => booksById.has(bookId))
                            .map(bookId => {
                                usedIds.add(bookId);
                                const book = booksById.get(bookId);
                                return `<li><a href="book.html?id=${book.id}">${book.name}</a></li>`;
                            });

                        if (categoryBooks.length > 0) {
                            booksHTML += `<article class="book-category"><h3>${category.title}</h3><ul>${categoryBooks.join('')}</ul></article>`;
                        }
                    });

                    const uncategorizedBooks = books
                        .filter(book => !usedIds.has(book.getAttribute('id')))
                        .map(book => `<li><a href="book.html?id=${book.getAttribute('id')}">${book.getAttribute('name')}</a></li>`);

                    if (uncategorizedBooks.length > 0) {
                        booksHTML += `<article class="book-category"><h3>Otros Libros</h3><ul>${uncategorizedBooks.join('')}</ul></article>`;
                    }

                    if (testamentName === 'Antiguo Testamento') {
                        document.getElementById('old-testament-books').innerHTML = booksHTML;
                    } else {
                        document.getElementById('new-testament-books').innerHTML = booksHTML;
                    }
                }
            })
            .catch(error => console.error('Error cargando XML:', error));
    </script>
</body>
</html>
