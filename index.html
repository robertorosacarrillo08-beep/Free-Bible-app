<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Bible App - Biblia Gratis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Free Bible App</h1>
            <p>Tu acceso gratuito a la Biblia en cualquier momento y lugar</p>
        </header>
        <div class="tabs">
            <button class="tab-button active" onclick="showTestament('old')">Antiguo Testamento</button>
            <button class="tab-button" onclick="showTestament('new')">Nuevo Testamento</button>
        </div>
        <section id="old-testament" class="testament-section active">
            <h2>Antiguo Testamento</h2>
            <div class="books-grid" id="old-testament-books"></div>
        </section>
        <section id="new-testament" class="testament-section">
            <h2>Nuevo Testamento</h2>
            <div class="books-grid" id="new-testament-books"></div>
        </section>
    </div>
    <script src="script.js"></script>
    <script>
        fetch('bible.xml')
            .then(response => response.text())
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                const testaments = xmlDoc.getElementsByTagName('testament');
                for (let testament of testaments) {
                    const testamentName = testament.getAttribute('name');
                    const books = testament.getElementsByTagName('book');
                    let booksHTML = '';
                    const booksByCategory = {};
                    for (let book of books) {
                        const bookId = book.getAttribute('id');
                        const bookName = book.getAttribute('name');
                        let category = 'Otros';
                        if (testamentName === 'Antiguo Testamento') {
                            if (['genesis','exodo','levitico','numeros','deuteronomio'].includes(bookId)) category = 'Pentateuco';
                        }
                        if (!booksByCategory[category]) booksByCategory[category] = [];
                        booksByCategory[category].push(`<li><a href="book.html?id=${bookId}">${bookName}</a></li>`);
                    }
                    for (let category in booksByCategory) {
                        booksHTML += `<div class="book-category"><h3>${category}</h3><ul>${booksByCategory[category].join('')}</ul></div>`;
                    }
                    if (testamentName === 'Antiguo Testamento') document.getElementById('old-testament-books').innerHTML = booksHTML;
                    else document.getElementById('new-testament-books').innerHTML = booksHTML;
                }
            })
            .catch(error => console.error('Error cargando XML:', error));
    </script>
</body>
</html>
